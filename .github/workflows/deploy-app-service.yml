name: Deploy to Azure App Service

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL: ${{ secrets.DB_SSL }}
          DB_USER: ${{ secrets.DB_USER }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          required=(
            AZURE_WEBAPP_NAME AZURE_RESOURCE_GROUP AZURE_CLIENT_ID
            AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID DB_HOST DB_NAME
            DB_PASSWORD DB_PORT DB_SSL DB_USER FRONTEND_ORIGIN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required deployment value '$name' is not configured." >&2
              exit 1
            fi
          done

      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Create deployment package
        shell: bash
        run: |
          mkdir -p release/services/backend release/services/frontend
          cp package.json package-lock.json release/
          cp services/backend/package.json release/services/backend/
          cp services/frontend/package.json release/services/frontend/
          cp -R services/backend/dist release/services/backend/dist
          cp -R services/frontend/dist release/services/frontend/dist
          npm ci --omit=dev --ignore-scripts --prefix release
          (cd release && zip -qr ../app-service.zip .)

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure application settings
        shell: bash
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL: ${{ secrets.DB_SSL }}
          DB_USER: ${{ secrets.DB_USER }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              NODE_ENV=production \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              WEBSITE_NODE_DEFAULT_VERSION='~22' \
              MYSQL_HOST="$DB_HOST" \
              MYSQL_DATABASE="$DB_NAME" \
              MYSQL_PASSWORD="$DB_PASSWORD" \
              MYSQL_PORT="$DB_PORT" \
              MYSQL_SSL="$DB_SSL" \
              MYSQL_USER="$DB_USER" \
              FRONTEND_ORIGIN="$FRONTEND_ORIGIN" \
            --output none

      - name: Deploy directly to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app-service.zip

      - name: Verify deployed application
        shell: bash
        env:
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          health_url="${FRONTEND_ORIGIN%/}/api/health"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$health_url"